[package]
name = "contracts"
version = "0.0.0"
edition.workspace = true
license.workspace = true

# Контрактный слой (T1). Канон — Rust-типы; JSON Schema генерируется из них (docs/fa/contracts.md).
# M-00: минимальный Event/EventKind, чтобы workspace собирался. Полный состав T1 — пофазно via contract-RFC.

[dependencies]
serde = { version = "1", features = ["derive"] }
# CT-I-4: JSON Schema ГЕНЕРИРУЕТСЯ из Rust-типов (канон), а не пишется руками (05 §4/§6).
schemars = "0.8"

[dev-dependencies]
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
