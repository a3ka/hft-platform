[package]
name = "gateway-serve"
version = "0.0.0"
edition.workspace = true
license.workspace = true

# M-28 — WS-транспорт кокпита (market-плоскость, D1/D6). ТОНКАЯ IO-оболочка над `crates/gateway`
# (детерминированная библиотека M-22). Read-only, stateless по юзеру: auth = verify подписанного JWT
# БЕЗ user-БД (GS-I-2). НЕ импортирует app-БД (postgres/sqlx/diesel — GS-I-1) и journal-writer (GS-I-3).
#
# Скелет (architect): контракт-типы (ServeMsg/Claims/AuthError) + сигнатуры с `unimplemented!()`.
# Тела auth/wire/serve-adapter + WS-сервер (tokio-tungstenite) — engine-dev (tasks 2-4), он же добавляет
# tokio/tokio-tungstenite в [dependencies].

[dependencies]
gateway = { path = "../gateway" }
journal = { path = "../journal" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"

[dev-dependencies]
contracts = { path = "../contracts" }
tempfile = "3"
