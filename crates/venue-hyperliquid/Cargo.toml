[package]
name = "venue-hyperliquid"
version = "0.0.0"
edition.workspace = true
license.workspace = true

# Адаптер Hyperliquid (docs/fa/venues.md). Emitter-not-owner. Один WS, подписки trades + l2Book.
# ВАЖНО (recon §B): l2Book levels — ОБЪЕКТЫ {px,sz,n}, не массивы. Никакого Redis/event_bus.

[dependencies]
contracts = { path = "../contracts" }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
