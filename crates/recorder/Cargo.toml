[package]
name = "recorder"
version = "0.0.0"
edition.workspace = true
license.workspace = true

# recorder: venue-адаптеры (Binance+HL) -> канал -> журнал (единственный писатель).
# docs/fa/venues.md, journal.md. Реальные WS-клиенты в venue-* крейтах.

[dependencies]
contracts = { path = "../contracts" }
journal = { path = "../journal" }
venue-binance = { path = "../venue-binance" }
venue-hyperliquid = { path = "../venue-hyperliquid" }
venue-binance-futures = { path = "../venue-binance-futures" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
