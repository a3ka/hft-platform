[package]
name = "ops"
version = "0.0.0"
edition.workspace = true
license.workspace = true

# Слой 7 (docs/fa/ops.md): наблюдаемость + сверка с биржей. MD-only, НЕ safety-путь
# (risk/killswitch/oms сюда не входят — scope-guard). Детерминированные чистые функции;
# I/O (REST-fetch) — в venue-*, метрики-scrape/бэкап — deploy/.

[dependencies]
contracts = { path = "../contracts" }
book = { path = "../book" }
# watchdog (founder-задача 2026-07-31, мост к M-43 task#3): heartbeat-JSON parse + состояние
# на диске + Telegram Bot API. `reqwest` уже общий workspace-выбор (venue-binance/-hyperliquid/
# -binance-futures/recorder) — здесь `blocking`, не async: `src/bin/ops-watchdog.rs` одноразовый
# cron-процесс, лишний tokio-рантайм в библиотечной части `ops` не нужен (см. мотивацию в
# `server.rs`).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
anyhow = "1"

[dev-dependencies]
journal = { path = "../journal" }
tempfile = "3"
