name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (warnings = errors)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test (RED/GREEN — наши инварианты)
        run: cargo test --all

  security:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-audit
        run: cargo install cargo-audit --locked
      - name: audit
        run: cargo audit

  delivery:
    name: Delivery gate (бинарь В ПРОД-ОБРАЗЕ, TD-020)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать прод-образ и ЗАПУСТИТЬ journal-retention внутри него
        env:
          HFT_DELIVERY_DEEP: "1"
        run: bash scripts/verify_delivery_M-08.sh

  status-check:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [build-test, security, delivery]
    if: always()
    steps:
      - run: |
          if [[ "${{ needs.build-test.result }}" != "success" || "${{ needs.security.result }}" != "success" || "${{ needs.delivery.result }}" != "success" ]]; then
            echo "One or more checks failed"; exit 1
          fi
          echo "All checks passed"
