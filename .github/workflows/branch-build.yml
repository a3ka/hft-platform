name: Branch build

# ЗАЧЕМ ЭТОТ WORKFLOW СУЩЕСТВУЕТ ОТДЕЛЬНО ОТ `ci.yml`
#
# Замер (`docs/plans/ci-branch-trigger-probe-2026-08-18.md`,
# `docs/plans/plan-branches-and-ci-2026-08-19.md` §A): `ci.yml` триггерится только на
# `pull_request` и `push` в `main` — и `branches: [main]` стоит там с первого коммита
# репозитория `25fe2c8`.
#
# ЭМПИРИКА, ПЕРЕМЕРЕННАЯ (`C-105` B-12 — первая редакция этой шапки называла «130» и
# абсолют «НОЛЬ», оба неверны; исправлено, а не оставлено):
#
#     gh api "repos/a3ka/hft-platform/actions/runs?event=push&per_page=100" --paginate
#       → CI / main .......................... 415
#       → Deploy to VPS / main ................ 91
#       → CI / ветка .......................... 1   (`fix/resource-oracle-barrier`,
#                                                    ран 32071359618 — startup_failure,
#                                                    НОЛЬ исполненных джобов)
#
# То есть ветка, на которой предмет живёт все круги гейта, не собиралась НИ РАЗУ —
# направление довода замер не меняет, но число обязано быть верным в документе, чей
# собственный тезис — «замер, а не ощущение».
#
# Цена этого, замеренная: M-69 прошёл ТРИ круга критика (`C-099` 00:25, `C-100` 09:18,
# `C-104` 15:42 — все 18.08), а один draft-PR за 9 минут дал три красных джоба, два из
# которых не нашли критики: коллизия `C-100` и врущая таблица `DESIGN` §22 (`A-010` §F).
# «Гейт, не собиравший предмет, — не гейт.»
#
# ПОЧЕМУ НЕ ПРАВКА `ci.yml` НА `push.branches: ['**']`
#
# Это предписание (`A-010` §F, оба независимых Fable-агента) отклонено ИСПОЛНЕНИЕМ, а не
# рассуждением: правка даёт ДЕТЕРМИНИРОВАННЫЙ красный набор, а не вероятностный.
#   1. Первый push любой новой ветки: `github.event.before` = zero-SHA → fail-closed
#      каскад роняет ПЯТЬ джобов (`protected-artifacts`, `docs-freeze`, `contracts`,
#      `artifact-ids`, `gate-meta`).
#   2. Любой force-push (rebase/amend — рутина агентов): `git merge-base --is-ancestor`
#      не проходит → те же пять джобов.
#   3. Процедура merge `gates.md` §8: push в ветку с открытым PR даёт два прогона на одном
#      SHA → `gh pr checks --watch` вернёт ненулевой код → `gh pr merge` не выполнится
#      НИКОГДА.
# Это не дефект барьеров: их инвариант «база = состояние до события» осмыслен только для
# входа в `main`; на ветке они честно говорят «гарантировать не могу». Чинить надо не их.
#
# КОНСТРУКЦИЯ, КОТОРАЯ РАБОТАЕТ ТАМ, ГДЕ ПРЕДПИСАНИЕ — НЕТ
#
#   · базу события не читает ВОВСЕ ⇒ zero-SHA и force-push безразличны (снимает 1 и 2);
#   · НЕ входит в агрегат `All checks passed` (тот живёт в `ci.yml`, свой список `needs`)
#     ⇒ merge не блокирует, процедура §8 цела (снимает 3);
#   · воли автора не требует — событие рождает GitHub, забыть нечего.
#
# ЧЕГО ЭТОТ WORKFLOW НЕ ДАЁТ — три предела, названные явно, БЕЗ механизма под ними
#
# `COGNITIVE-ONLY` (`binding-requires-mechanism.md`): ни один из трёх ниже не закрыт
# барьером, и барьер здесь не изображается. Попытка построить его была — 508 строк,
# девять проверок — и адверсарий её отклонил (`research/critiques/C-105-branch-build-harness.md`,
# REJECT: девять форм обезвреживания проходили барьер зелёными, включая подделку
# required-контекста именем джоба). Механизировать эти пределы дешевле, чем изображать
# закрытыми; отклонённая попытка сохранена вердиктом, а не переписана в успех.
#
#   1. ДЕРЕВО СЛИЯНИЯ. Push-триггер строит ВЕТКУ, а не merge-preview: отставания от `main`
#      он не покажет. За это отвечает
#      `bash scripts/verify_design_claims.sh --merge-preview origin/main` (`gates.md` §8,
#      где `strict: false` назван принятым пределом).
#
#   2. ПАРИТЕТ СОСТАВА. Состав джоба ниже дословно повторяет job `build-test` из `ci.yml`.
#      Разойдётся — «ветка собирается» станет означать МЕНЬШЕ, чем «`main` собирается», и
#      это тихо. Машинной сверки НЕТ. Проверка стоит одной команды и делается глазами при
#      правке любого из двух файлов:
#          diff <(sed -n '/^  build-test:/,/^$/p' .github/workflows/ci.yml) \
#               <(sed -n '/^  build-test:/,/^$/p' .github/workflows/branch-build.yml)
#
#   3. ОТМЕНЁННАЯ СБОРКА НЕ НАБЛЮДАЕТСЯ НИЧЕМ (`C-105` B-10, воспроизведено на живом PR).
#      `cancel-in-progress: true` делает отмену ШТАТНЫМ событием, а `gh pr checks` для
#      отменённого рана печатает `fail` и возвращает **0** — то есть процедура merge
#      `gates.md` §8 сказала бы «мержу». Настоящий `failure` при этом распознаётся верно
#      (контроль: exit=1). Развязка — правка нормы §8, зона замка §11, решение founder'а.
#      Пока её нет: «ветка не собралась» не наблюдает ни branch protection (чек не
#      required), ни `gh pr checks`, ни что-либо ещё.
on:
  push:
    branches-ignore: [main]

# Серия push'ей в одну ветку — рутина (intra-chain push, `gates.md` §8). Без отмены
# предыдущего прогона каждая правка оставляла бы за собой очередь мёртвых сборок.
# Отличие от `deploy.yml`, где `cancel-in-progress: false` НАМЕРЕННО: там отмена на полпути
# оставила бы прод в промежуточном состоянии. Здесь отменять безопасно — сборка ветки
# ничего не публикует и ничего не трогает.
concurrency:
  group: branch-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: fmt + clippy + test (ветка)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (warnings = errors)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test (RED/GREEN — наши инварианты)
        run: cargo test --all
