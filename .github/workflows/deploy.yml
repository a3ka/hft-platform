name: Build and Deploy to VPS

# Паттерн адаптирован из openclaw/PROJECT deploy.yml. Трейдинг-адаптации:
#  1) journal-том persistent — редеплой не трогает данные (docker-compose.yml).
#  2) recorder 24/7: редеплой = короткий gap записи (на P0/P1 терпимо, ресинк при reconnect).
#  3) HUMAN-GATE на деплой: job `deploy` использует environment `production` — настрой в
#     GitHub → Settings → Environments → production → Required reviewers (это наш HDP-аналог:
#     автоматизация до денег, человек на деньгах). Для live-торговли approve ОБЯЗАТЕЛЕН.

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build image → ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hft-platform-recorder:latest
            ghcr.io/${{ github.repository_owner }}/hft-platform-recorder:${{ github.sha }}

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production   # ← HUMAN-GATE (required reviewers)
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /root/hft-platform
            git pull --ff-only
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/hft-platform-recorder:${{ github.sha }}
            docker tag ghcr.io/${{ github.repository_owner }}/hft-platform-recorder:${{ github.sha }} \
                       ghcr.io/${{ github.repository_owner }}/hft-platform-recorder:latest
            docker compose up -d --no-deps recorder
            echo "=== wait healthy (90s) ==="
            timeout 90 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" hft-recorder 2>/dev/null)" = healthy ]; do sleep 5; done' || {
              echo "UNHEALTHY — logs:"; docker logs hft-recorder --tail 50; exit 1;
            }
            docker image prune -f
            echo "=== deployed ${{ github.sha }} ==="

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/hft-platform
            PREV=$(docker images ghcr.io/${{ github.repository_owner }}/hft-platform-recorder --format '{{.Tag}}' | grep -v latest | sort | tail -2 | head -1)
            if [ -n "$PREV" ]; then
              docker tag ghcr.io/${{ github.repository_owner }}/hft-platform-recorder:$PREV ghcr.io/${{ github.repository_owner }}/hft-platform-recorder:latest
              docker compose up -d --no-deps recorder
              echo "rolled back to $PREV"
            fi
