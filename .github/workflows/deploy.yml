name: Deploy to VPS

# Build-on-VPS: без registry/ghcr, без токенов. Один VPS, один образ — VPS сам собирает.
# Триггер: пуш в main (по путям кода) → SSH на VPS → git pull → docker compose up --build.
#
# Трейдинг-адаптации:
#  1) journal-том persistent (docker-compose.yml) — редеплой данные не трогает.
#  2) recorder 24/7 — редеплой = короткий gap записи (P0/P1 терпимо, ресинк при reconnect).
#  3) HUMAN-GATE на деплой добавляется на P4 (live-торговля): раскомментировать `environment:
#     production` + настроить Required reviewers. Сейчас (recorder/testnet, без денег) не нужен.

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy (build on VPS)
    runs-on: ubuntu-latest
    # environment: production   # ← P4: включить + Required reviewers для live-торговли
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -uo pipefail
            cd /root/hft-platform
            PREV=$(git rev-parse HEAD)
            git fetch -q origin main && git reset --hard -q origin/main
            echo "=== deploy $(git rev-parse --short HEAD) (prev $(git rev-parse --short "$PREV")) ==="
            if docker compose up -d --build recorder \
               && timeout 300 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" hft-recorder 2>/dev/null)" = healthy ]; do sleep 5; done'; then
              echo "=== healthy — deployed $(git rev-parse --short HEAD) ==="
              docker image prune -f
            else
              echo "=== DEPLOY FAILED — logs + rollback to $(git rev-parse --short "$PREV") ==="
              docker logs hft-recorder --tail 50 || true
              git reset --hard -q "$PREV"
              docker compose up -d --build recorder
              exit 1
            fi
