groups:
  - name: ops.family.canon
    interval: 30s
    rules:
      - alert: TD-011
        expr: rate(journal_bytes_written_total[1m]) == 0
        for: 1m
        labels:
          severity: P0
          incident: TD-011
        annotations:
          summary: "journal bytes written — нулевой прирост за 60с (recorder жив, но не пишет)"
      - alert: TD-013
        expr: sum(rate(venue_http_status_total{code=~"418|429"}[5m])) / sum(rate(venue_http_status_total[5m])) > 0.5
        for: 5m
        labels:
          severity: P1
          incident: TD-013
        annotations:
          summary: "venue HTTP 4xx (418/429) доля > порога — rate-limit от биржи (TD-013)"
      - alert: TD-014
        expr: rate(md_events_total[5m]) == 0
        for: 5m
        labels:
          severity: P1
          incident: TD-014
        annotations:
          summary: "md_events_total — нулевая производная по kind при живом WS (Funding/Trade пропали)"
      - alert: TD-016
        expr: recorder_rss_anon_bytes > 4294967296
        for: 5m
        labels:
          severity: P1
          incident: TD-016
        annotations:
          summary: "recorder RSS-anon тренд > порога/час — утечка памяти (TD-016)"
      - alert: C1-M08
        expr: rate(book_resync_total[5m]) > 0
        for: 1m
        labels:
          severity: P0
          incident: C1-M08
        annotations:
          summary: "recon ресинк книги при best-расхождении — порча near-touch (C1-M08, B2 §4.3.2)"
      - alert: TD-006
        expr: journal_disk_free_bytes < 10737418240
        for: 1m
        labels:
          severity: P0
          incident: TD-006
        annotations:
          summary: "journal_disk_free_bytes < min_free_bytes — диск кончается (TD-006)"
      - alert: OPS-BKP
        expr: backup_restore_drill_ok == 0
        for: 1m
        labels:
          severity: P0
          incident: OPS-BKP
        annotations:
          summary: "backup_restore_drill_ok == 0 — restore-drill провален (бэкап не бэкап)"
      - alert: OPS-SILENCE
        expr: md_event_age_ms > 300000
        for: 5m
        labels:
          severity: P1
          incident: OPS-SILENCE
        annotations:
          summary: "md_event_age_ms > 5min — поток молчит, процесс жив (OPS-I-8, OPS-SILENCE)"
      - alert: OPS-RESYNC
        expr: rate(book_resync_total[15m]) > 0.1
        for: 5m
        labels:
          severity: P1
          incident: OPS-RESYNC
        annotations:
          summary: "book_resync_total rate > порога — частые ресинки (скрытая проблема фида)"
      - alert: OPS-GAP
        expr: journal_seq_gaps_total / journal_seq_current > 0.01
        for: 5m
        labels:
          severity: P1
          incident: OPS-GAP
        annotations:
          summary: "journal_seq_gaps_total / journal_seq_current > 1% за сутки — gap-доля (OPS-GAP)"
